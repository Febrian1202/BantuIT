services:
  mysql:
    image: mysql:8.4
    container_name: bantuit_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: BantuIT
      MYSQL_USER: bantuit
      MYSQL_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306" # 3306 digunakan untuk MySQL bawaan sistem
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    container_name: bantuit_api
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      SERVER_NAME: "http://:8000"
      XDG_CONFIG_HOME: /tmp
      XDG_DATA_HOME: /tmp
      HOME: /tmp
      APP_VERSION: "${APP_VERSION:-0.2.0}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: BantuIT
      DB_USERNAME: bantuit
      DB_PASSWORD: secret
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:800/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scheduler:
    build:
      context: .
      dockerfile: docker/api/Dockerfile.dev
    container_name: bantuit_scheduler
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan schedule:work
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: BantuIT
      DB_USERNAME: bantuit
      DB_PASSWORD: secret
    volumes:
      - ./apps/api:/app
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile.dev
    container_name: bantuit_web
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      API_BASE_URL: http://api:8000/api
      APP_VERSION: "${APP_VERSION:-0.2.0}"
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  mysql-data:
  web-node-modules:
